<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zastava Island</title>
  <style>
    .a {
      background-color: darkblue;
      width: 500px;
      height: 300px;
      position: relative;
      border: 2px solid black;
    }

    .b {
      background-color: white;
      width: 500px;
      height: 75px;
      position: absolute;
      top: 110px;
    }

    .c {
      background-color: white;
      width: 75px;
      height: 300px;
      position: absolute;
      left: 110px;
    }

    .d {
      background-color: red;
      position: absolute;
      width: 500px;
      height: 40px;
      top: 125px;
    }

    .e {
      background-color: red;
      position: absolute;
      width: 40px;
      height: 300px;
      left: 127px;

    }
  </style>
</head>

<body>
  <div class="a">
    <div class="b"></div>
    <div class="c"></div>
    <div class="d"></div>
    <div class="e"></div>

  </div>

</body>

</html>
