<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zastava Laosa</title>
  <style>
    .a {
      position: relative;
      width: 500px;
      height: 350px;
      left: 100px;
      top: 100px;
      background-color: darkblue;
    }

    .b {
      position: absolute;
      width: 500px;
      height: 100px;
      background-color: red;
    }

    .c {
      position: absolute;
      width: 500px;
      height: 100px;
      background-color: red;
      top: 300px;
    }

    .d {
      position: absolute;
      width: 125px;
      height: 125px;
      background-color: white;
      border-radius: 50%;
      top: 140px;
      left: 190px;
    }
  </style>
</head>

<body>
  <div class="a">
    <div class="b"></div>
    <div class="c"></div>
    <div class="d"></div>
  </div>


</body>

</html>
