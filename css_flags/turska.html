<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turska</title>
  <style>
    .a {
      background-color: red;
      position: relative;
      width: 500px;
      height: 300px;

    }

    .b {
      background-color: white;
      position: absolute;
      width: 75px;
      height: 75px;
      clip-path: polygon(50% 0%,
          61% 35%,
          98% 35%,
          68% 57%,
          79% 91%,
          50% 70%,
          21% 91%,
          32% 57%,
          2% 35%,
          39% 35%);
      transform: rotate(-25deg);

      left: 250px;
      top: 125px;


    }
  </style>
</head>

<body>
  <div class="a">
    <div class="b"></div>
  </div>
</body>

</html>
