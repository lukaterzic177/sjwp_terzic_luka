<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .a {
      position: relative;
      width: 500px;
      height: 350px;
      left: 100px;
      top: 100px;
      background-color: green;
      border: 2px solid black;
    }

    .b {
      position: absolute;
      width: 300px;
      height: 175px;
      left: 200px;
      top: 0px;
      background-color: yellow;
    }

    .c {
      position: absolute;
      width: 300px;
      height: 175px;
      top: 175px;
      left: 200px;
      background-color: red;
    }
  </style>
</head>

<body>
  <div class="a">
    <div class="b"></div>
    <div class="c"></div>
  </div>

</body>

</html>
