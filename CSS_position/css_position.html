<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div {
      width: 300px;
      height: 300px;

    }

    .relative {
      background-color: chocolate;
      position: relative;
    }

    .absolute {
      background-color: blue;
      position: absolute;
      top: 50px;
      left: 50px;
      z-index: -1;
    }
  </style>
</head>

<body>
  <div class="relative"></div>
  <div class="absolute"></div>
</body>

</html>
