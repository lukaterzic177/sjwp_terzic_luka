<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablice</title>
</head>

<body>
  <h1>Tablice</h1>
  <table border="1" width="550">
    <tr>
      <th>Tvrtka</th>
      <th>Kontakt</th>
      <th>Zemlja</th>
    </tr>
    <tr>
      <td>Primax doo</td>
      <td>Vedran Dankić</td>
      <td>Hrvatska</td>
    </tr>
    <tr>
      <td>Vet-dom Cetinjanin</td>
      <td>Davorin Cetinjanin</td>
      <td>Austrija</td>
    </tr>
  </table>
  <h2>Spajanje stupaca</h2>
  <table border="1">
    <tr>
      <th colspan="2">Ime i Prezime</th>
      <th>godine</th>
    </tr>
    <tr>
      <td>Filip</td>
      <td>Dankic</td>
      <td>17</td>
    </tr>
    <tr>
      <td>Petar</td>
      <td>Cetinjanin</td>
      <td>17</td>
    </tr>
  </table>
  <h2>Spajanje redova</h2>
  <table border="1">
    <tr>
      <th>Ime</th>
      <td>Ivan</td>
    </tr>
    <tr>
      <td rowspan="2">Mobitel</td>
      <td>555-1234</td>
    </tr>
    <tr>
      <td>555-4321</td>
    </tr>
  </table>

</body>

</html>
