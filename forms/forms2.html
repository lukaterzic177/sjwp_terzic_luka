<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms</title>
</head>

<body style="background-color: pink;">
  <h1 style="text-align: center;">Student registration form</h1>
  <form action="#" method="get">
    <label for="roll">Roll no:</label>
    <input type="number" name="roll" id="roll">
    <br>
    <br>
    <label for="name">Student name:</label>
    <input type="text" name="name" id="name">
    <br>
    <br>
    <label for="father">Father name:</label>
    <input type="text" name="father" id="father">
    <br>
    <br>
    <label for="date">Date of birth</label>
    <input type="date" name="date" id="date">
    <br>
    <br>
    <label for="tel">Mobile no:</label>
    <input type="tel" name="tel" id="tel">
    <br>
    <br>
    <label for="lozinka">Password:</label>
    <input type="password" name="lozinka" id="lozinka">
    <br>
    <br>
    <p>Gender:</p>
    <input type="radio" name="gender" id="Male">
    <label for="Male">Male</label>
    <input type="radio" name="gender" id="Fe">
    <label for="Fe">Female</label>
    <br>
    <br>
    <p>Department:</p>
    <input type="checkbox" name="a" id="1">
    <label for="1">CSE</label>
    <input type="checkbox" name="b" id="2">
    <label for="2">IT</label>
    <input type="checkbox" name="c" id="3">
    <label for="3">ECE</label>
    <input type="checkbox" name="d" id="4">
    <label for="4">Civil</label>
    <input type="checkbox" name="e" id="5">
    <label for="5">Mech</label>
    <br>
    <br>
    <label for="Cours">Course:</label>
    <select name="Cours" id="Cours">
      <option value="1">Elektrotehnika</option>
      <option value="2">Strojarstvo</option>
      <option value="3">Racunalstvo</option>
    </select>
    <br>
    <br>
    <label for="foto">Student foto:</label>
    <input type="file" name="foto" id="foto">
    <br>
    <br>
    <label for="city">City:</label>
    <input type="text" name="city" id="city">
    <br>
    <br>
    <p>Addres:</p>
    <textarea name="Addres" id="Addres" rows="4" cols="50"></textarea>
    <br>
    <br>
    <input type="submit" value="Pošalji">



























  </form>

</body>

</html>
