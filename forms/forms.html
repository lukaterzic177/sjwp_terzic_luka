<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms</title>
</head>

<body>
  <h1>HTML forme</h1>
  <form action="#" method="get">
    <label for="name">Unesi ime:</label>
    <input type="text" id="name" placeholder="unesi ime..." size="15" maxlength="5" required>
    <br>
    <br>
    <label for="pass">Unesi lozinku:</label>
    <input type="password" name="pass" id="pass">
    <br>
    <br>
    <label for="mail">Unesi mail:</label>
    <input type="email" name="mail" id="mail">
    <br>
    <br>
    <label for="date">Izaberi datum</label>
    <input type="date" name="date" id="date">
    <br>
    <br>
    <label for="color">Izaberi boju</label>
    <input type="color" name="color" id="color">
    <br>
    <br>
    <label for="file">Izaberi file:</label>
    <input type="file" name="file" id="file" pattern="[0-9]+" title="Unesite samo brojeve">
    <br>
    <br>
    <label for="tel">Unesi broj telefona:</label>
    <input type="tel" name="tel" id="tel">
    <br>
    <br>
    <p>Oadberi najbolji klub:</p>
    <input type="radio" name="klub" id="real">
    <label for="real">Real Madrid</label>
    <br>
    <br>
    <input type="radio" name="klub" id="barca">
    <label for="barca">Barcelona</label>
    <br>
    <br>
    <input type="radio" name="klub" id="marsa">
    <label for="marsa">Marsonija</label>
    <p>Odaberi najbolji klub</p>
    <input type="checkbox" name="klub1" id="real">
    <label for="real">Real Madrid</label>
    <br>
    <br>
    <input type="checkbox" name="klub2" id="barca">
    <label for="barca">Barcelona</label>
    <br>
    <br>
    <input type="checkbox" name="klub3" id="marsa">
    <label for="marsa">Marsonija</label>


    <br>
    <input type="submit" value="Pošalji">
    <input type="reset" value="Obriši sve">



  </form>

</body>

</html>
